<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Segurança: o GitHub Pages não permite definir cabeçalhos de resposta, então
     o que dá para fazer pelo HTML é definido aqui. Ficam de fora HSTS e
     X-Content-Type-Options, que só existem como cabeçalho (achado SEC-1). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="same-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | WF Folha &amp; Gestão</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap">
<style>
  :root{ --bg:#FBFCFC; --ink:#1A1A1A; --ink-soft:#4C5A61; --petrol:#084D6E; --border:#DCE3E6; --surface:#FFFFFF; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0E1417; --ink:#EDF0F1; --ink-soft:#AEBBC1; --petrol:#5FA0C4; --border:#263136; --surface:#131B1F; } }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; padding:24px 16px;}
  main{max-width:560px; text-align:center;}
  .codigo{font-family:'Archivo',sans-serif; font-weight:800; font-size:4.5rem; line-height:1; color:var(--petrol);}
  h1{font-family:'Archivo',sans-serif; font-size:1.6rem; margin:12px 0 8px;}
  p{color:var(--ink-soft); margin:0 0 24px; line-height:1.5;}
  nav{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  a{display:inline-flex; align-items:center; min-height:44px; padding:10px 18px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); text-decoration:none; font-weight:600;}
  a.principal{background:#084D6E; border-color:#084D6E; color:#FFFFFF;} /* petróleo fixo: branco legível nos dois modos */
  /* auditoria A-6: link de pulo para quem navega por teclado */
  .pular-conteudo{position:absolute; left:16px; top:-100px; z-index:200; background:var(--petrol);
    color:#fff; font-weight:700; padding:12px 20px; border-radius:var(--radius-m);
    text-decoration:none; transition:top 180ms ease-out;}
  .pular-conteudo:focus{top:16px;}
</style>
</head>
<body>
<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<main id="conteudo">
  <div class="codigo">404</div>
  <h1>Esta página não existe</h1>
  <p>O endereço pode ter mudado ou ter sido digitado errado. Escolha para onde quer ir:</p>
  <nav>
    <a class="principal" href="/">Página inicial</a>
    <a href="/ponto/">Registro de ponto</a>
    <a href="/calculo-rescisao/">Cálculo de rescisão</a>
    <a href="https://wa.me/5581999955522?text=Ol%C3%A1%21%20Vim%20pelo%20site." target="_blank" rel="noopener">Falar no WhatsApp</a>
  </nav>
</main>
<p style="text-align:center;font-size:.82rem;padding:0 16px 24px"><a href="/privacidade/">Política de Privacidade</a></p>
</body>
</html>
